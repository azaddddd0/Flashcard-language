<style>
:root{
  --paper:#F5F2EA; --ink:#1C1D1F; --ink-soft:#6D6B65;
  --seal:#C03A22; --jade:#2C7A57; --card:#FFFFFF; --line:#E2DCCF; --gold:#C9A227; --blue:#3A6EA5; --r:22px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans SC',-apple-system,sans-serif;
  display:flex;flex-direction:column;max-width:540px;margin:0 auto;height:100vh;height:100dvh;
  padding:12px 16px calc(10px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}
button,input,select{font-family:inherit}
button{cursor:pointer}
header{display:flex;align-items:center;gap:8px}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:1.02rem;flex:1;line-height:1.15}
h1 em{font-style:normal;color:var(--seal)}
h1 small{display:block;font-family:'Noto Sans SC',sans-serif;font-weight:400;font-size:.58rem;color:var(--ink-soft);letter-spacing:.02em}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 9px;font-size:.75rem;color:var(--ink);white-space:nowrap}
.icon-btn b{color:var(--gold)}
select{font-size:.72rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;max-width:38%}
.row{display:flex;gap:6px;margin-top:9px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;font-size:.72rem;padding:5px 10px;color:var(--ink-soft)}
.seg button.on{background:var(--ink);color:var(--paper)}
.bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--jade);transition:width .2s}
.stats{display:flex;justify-content:space-between;font-size:.68rem;color:var(--ink-soft);margin-top:5px}
.stats b.ok{color:var(--jade)}.stats b.st{color:var(--gold)}
.deck{position:relative;flex:1;min-height:0;margin:12px 0}
.cw{position:absolute;inset:0;touch-action:none;transition:transform .28s cubic-bezier(.2,.8,.3,1),opacity .28s}
.cw.drag{transition:none}
.cw.out-l{transform:translateX(-120%) rotate(-8deg);opacity:0}
.cw.out-r{transform:translateX(120%) rotate(8deg);opacity:0}
.cw.in-l{transform:translateX(-120%) rotate(-8deg);opacity:0}
.cw.in-r{transform:translateX(120%) rotate(8deg);opacity:0}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.9,.3,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);box-shadow:0 10px 26px rgba(28,29,31,.09);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:58px 26px;text-align:center}
.face.back{transform:rotateY(180deg)}
.chip{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:center;font-size:.6rem;gap:6px}
.chip .sub{color:var(--seal);border:1.4px solid var(--seal);border-radius:6px;padding:3px 7px;transform:rotate(-2deg);max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .side{color:var(--ink-soft);letter-spacing:.12em;white-space:nowrap}
.chip .custom{color:var(--blue);border:1.2px solid var(--blue);border-radius:5px;padding:1px 5px;font-size:.55rem}
.en{font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem;line-height:1.32}
.zh{font-weight:500;font-size:1.42rem;line-height:1.5}
.mark{position:absolute;bottom:36px;font-size:.8rem;letter-spacing:2px;color:var(--gold)}
.mark.known{color:var(--jade);letter-spacing:0;font-size:.72rem;border:1.4px solid var(--jade);border-radius:6px;padding:2px 8px}
.hint{position:absolute;bottom:14px;left:0;right:0;font-size:.62rem;color:var(--ink-soft)}
.ctrls{display:flex;justify-content:center;align-items:center;gap:22px}
.ctrl{width:60px;height:60px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);
  font-size:1.4rem;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(28,29,31,.07);transition:transform .1s}
.ctrl:active{transform:scale(.9)}
.ctrl.small{width:46px;height:46px;font-size:1rem;color:var(--ink-soft)}
.ctrl.st{color:var(--gold)}.ctrl.ok{color:var(--jade)}
.end{position:absolute;inset:0;border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}
.end.show{display:flex}
.end .seal{font-family:'Fraunces',serif;font-size:1.9rem;color:var(--jade);border:3px solid var(--jade);border-radius:10px;padding:6px 15px;transform:rotate(-5deg)}
.end h2{font-family:'Fraunces',serif;font-size:1.35rem}
.end p{font-size:.83rem;color:var(--ink-soft);line-height:1.6}
.pill{border:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 20px;font-size:.82rem}
.pill.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.pill.blue{background:var(--blue);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(28,29,31,.35);display:none;z-index:20}
.sheet.show{display:block}
.sheet-inner{position:absolute;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;height:90%;
  background:var(--paper);border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head h2{font-family:'Fraunces',serif;font-size:1.05rem;flex:1}
.wb-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:10px}
.wb-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.wb-text{flex:1;min-width:0}
.wb-text .e{font-family:'Fraunces',serif;font-weight:600;font-size:.92rem}
.wb-text .z{font-size:.82rem;color:var(--ink-soft);margin-top:2px}
.wb-text .c{font-size:.66rem;color:var(--seal);margin-top:3px}
.wb-stars{color:var(--gold);font-size:.78rem;letter-spacing:1px;white-space:nowrap}
.wb-x{border:none;background:none;color:var(--ink-soft);font-size:1rem;padding:4px 2px}
.wb-empty{text-align:center;color:var(--ink-soft);font-size:.85rem;padding:40px 20px;line-height:1.8}
.sheet-foot{display:flex;gap:8px;padding-top:10px}
.sheet-foot .pill{flex:1;text-align:center}
/* manage sheet */
.mtabs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);margin-top:10px}
.mtabs button{flex:1;border:0;background:none;font-size:.76rem;padding:7px 0;color:var(--ink-soft)}
.mtabs button.on{background:var(--ink);color:var(--paper)}
.mpane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:.72rem;color:var(--ink-soft);margin-bottom:4px}
.field input[type=text],.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.9rem;background:var(--card);color:var(--ink)}
.field-row{display:flex;gap:8px}
.field-row .field{flex:1}
.msg{font-size:.78rem;padding:8px 10px;border-radius:10px;margin-bottom:10px;display:none}
.msg.show{display:block}
.msg.ok{background:#E4F2EA;color:var(--jade)}
.msg.warn{background:#FBEAE6;color:var(--seal)}
.search-box{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.85rem;background:var(--card);color:var(--ink)}
.search-hit{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.search-hit .e{font-family:'Fraunces',serif;font-weight:600;font-size:.9rem}
.search-hit .z{font-size:.8rem;color:var(--ink-soft);margin-top:2px}
.search-hit .c{font-size:.66rem;color:var(--seal);margin-top:4px}
.search-hit .edit-link{font-size:.72rem;color:var(--blue);margin-top:6px;display:inline-block}
.danger{color:var(--seal);font-size:.76rem;background:none;border:1px solid var(--seal);border-radius:10px;padding:8px;width:100%;margin-top:4px}
@media (prefers-reduced-motion:reduce){.card,.cw,.bar i{transition:none}}
</style>
</head>
<body>

<header>
  <h1>Casual oral <em>0711</em><small id="stamp"></small></h1>
  <button class="icon-btn" id="manageBtn">+ Vocab</button>
  <button class="icon-btn" id="wbBtn">★ <b id="wbCount">0</b></button>
</header>

<div class="row">
  <div class="seg" id="modeSeg">
    <button data-mode="mix" class="on">Mixed</button>
    <button data-mode="en">EN→ZH</button>
    <button data-mode="zh">ZH→EN</button>
  </div>
  <select id="catSel"></select>
</div>

<div class="bar"><i id="fill"></i></div>
<div class="stats">
  <span id="posTxt">0 / 0</span>
  <span><b class="ok" id="okN">0</b> known · <b class="st" id="stN">0</b> starred</span>
</div>

<div class="deck" id="deck">
  <div class="end" id="end">
    <div class="seal">Done</div>
    <h2 id="endTitle">Round complete</h2>
    <p id="endTxt"></p>
    <button class="pill" id="againBtn">Shuffle &amp; restart</button>
    <button class="pill alt" id="studyStarBtn">Study starred words</button>
  </div>
</div>

<div class="ctrls">
  <button class="ctrl st" id="starBtn" title="Don't know it — add a star">✕</button>
  <button class="ctrl small" id="flipBtn" title="Flip">⇄</button>
  <button class="ctrl ok" id="okBtn" title="Know it well — hide for a while">✓</button>
</div>

<!-- wordbook sheet -->
<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <div class="sheet-head">
      <h2 id="sheetTitle">Wordbook</h2>
      <div class="seg" id="wbSeg">
        <button data-tab="star" class="on">Starred</button>
        <button data-tab="known">Known</button>
      </div>
      <button class="icon-btn" id="closeSheet">Close</button>
    </div>
    <div class="stats"><span id="wbSummary"></span></div>
    <div class="wb-list" id="wbList"></div>
    <div class="sheet-foot">
      <button class="pill" id="wbStudy">Study these</button>
      <button class="pill alt" id="wbClear">Clear</button>
    </div>
  </div>
</div>

<!-- manage sheet: add / search & edit -->
<div class="sheet" id="manageSheet">
  <div class="sheet-inner">
    <div class="sheet-head">
      <h2>Manage vocabulary</h2>
      <button class="icon-btn" id="closeManage">Close</button>
    </div>
    <div class="mtabs" id="mtabs">
      <button data-tab="add" class="on">Add / Edit</button>
      <button data-tab="search">Search</button>
    </div>

    <div class="mpane" id="paneAdd">
      <div class="msg" id="addMsg"></div>
      <div class="field">
        <label>English</label>
        <input type="text" id="fEn" placeholder="e.g. To touch base">
      </div>
      <div class="field">
        <label>Chinese</label>
        <input type="text" id="fZh" placeholder="e.g. to check in with someone">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Section</label>
          <select id="fSec"></select>
        </div>
        <div class="field">
          <label>Sub-section</label>
          <select id="fSub"></select>
        </div>
      </div>
      <div class="field" id="newSecWrap" style="display:none">
        <label>New section name</label>
        <input type="text" id="fNewSec" placeholder="Type a new section name">
      </div>
      <div class="field" id="newSubWrap" style="display:none">
        <label>New sub-section name</label>
        <input type="text" id="fNewSub" placeholder="Type a new sub-section name">
      </div>
      <button class="pill blue" id="saveWordBtn" style="width:100%">Save</button>
      <button class="danger" id="hideWordBtn" style="display:none">Hide this word (remove from deck)</button>
      <button class="danger" id="deleteWordBtn" style="display:none">Delete this custom word</button>
      <button class="pill alt" id="clearFormBtn" style="width:100%;margin-top:8px">Clear form / add new word</button>
    </div>

    <div class="mpane" id="paneSearch" style="display:none">
      <input type="text" class="search-box" id="searchBox" placeholder="Search English or Chinese…">
      <div class="wb-list" id="searchResults" style="margin-top:10px"></div>
    </div>
  </div>
</div>

});

  async get(k){
    if(backend==="claude"){ try{ const r=await window.storage.get(k); return r?JSON.parse(r.value):null; }catch(e){} }

const SNOOZE_DAYS = 7, DAY = 86400000;
let stars={}, known={}, customCards={}, overrides={};
let ALL = [];  // effective merged pool, rebuilt by rebuildAll()

function rebuildAll(){
  const list = [];
  BASE.forEach(function(c){
    const ov = overrides[c.key];
    if(ov && ov.hidden) return;
    list.push({
      key:c.key,
      en:c.en,
      zh:(ov && ov.zh) ? ov.zh : c.zh,
      sec:(ov && ov.sec) ? ov.sec : c.sec,
      sub:(ov && ov.sub) ? ov.sub : c.sub,
      custom:false
    });
  });
  Object.keys(customCards).forEach(function(key){
    const c = customCards[key];
    list.push({ key:key, en:c.en, zh:c.zh, sec:c.sec, sub:c.sub, custom:true });
  });
  ALL = list;
}

const isSnoozed = k => (known[k]||0) > Date.now();

let mode="mix", cat="all", starOnly=false;
let order=[], pos=0;
const deck=document.getElementById("deck"), endPanel=document.getElementById("end");

function buildCatMenu(){
  const sel=document.getElementById("catSel");
  const prev = sel.value || "all";
  sel.innerHTML='<option value="all">All sections</option>';
  const bySec={};
  ALL.forEach(function(c){ if(!bySec[c.sec]) bySec[c.sec]={}; bySec[c.sec][c.sub]=true; });
  Object.keys(bySec).sort().forEach(function(sec){
    const g=document.createElement("optgroup");g.label=sec;
    const a=document.createElement("option");a.value="sec:"+sec;a.textContent="— Whole section: "+sec;g.appendChild(a);
    Object.keys(bySec[sec]).sort().forEach(function(sub){
      const o=document.createElement("option");o.value="sub:"+sub;o.textContent=sub;g.appendChild(o);
    });
    sel.appendChild(g);
  });
  const opts = Array.prototype.map.call(sel.options, function(o){return o.value;});
  sel.value = opts.indexOf(prev)>=0 ? prev : "all";
}

document.getElementById("catSel").addEventListener("change",function(){

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

function pool(){
  let p = starOnly ? ALL.filter(function(c){return stars[c.key];})
    : cat==="all" ? ALL.slice()
    : (function(){var kv=cat.split(/:(.+)/),k=kv[0],v=kv[1];return ALL.filter(function(c){return k==="sec"?c.sec===v:c.sub===v;});})();
  if(!starOnly) p=p.filter(function(c){return !isSnoozed(c.key);});
  return p;
}

function start(){
  order=shuffle(pool().map(function(c){return {key:c.key, side: mode==="mix"?(Math.random()<.5?"en":"zh"):mode};}));
  pos=0;endPanel.classList.remove("show");render();
}

function cardByKey(key){
  for(var i=0;i<ALL.length;i++) if(ALL[i].key===key) return ALL[i];
  return null;
}

function cardHTML(item){
  const d=cardByKey(item.key);
  if(!d) return '<div class="card"></div>';
  const frontEn=item.side==="en";
  const s=stars[d.key]||0;
  const mark = isSnoozed(d.key) ? '<div class="mark known">Known · hidden for '+SNOOZE_DAYS+' days</div>'
             : s ? '<div class="mark">'+"★".repeat(s)+"☆".repeat(5-s)+'</div>' : "";
  const customTag = d.custom ? '<span class="custom">custom</span>' : "";
  function face(isEn,txt,tag,isFront){
    return '<div class="face '+(isFront?"front":"back")+'">'
      +'<div class="chip"><span class="sub">'+d.sub+'</span>'+customTag+'<span class="side">'+tag+'</span></div>'
      +'<div class="'+(isEn?"en":"zh")+'">'+txt+'</div>'
      +mark
      +'<div class="hint">Tap to flip · swipe to move · ✕ star it · ✓ I know this</div>'
      +'</div>';
  }
  return '<div class="card">'
    + face(frontEn, frontEn?d.en:d.zh, frontEn?"EN":"ZH", true)
    + face(!frontEn, frontEn?d.zh:d.en, frontEn?"ZH":"EN", false)
    + '</div>';
}

function render(dir){
  deck.querySelectorAll(".cw").forEach(function(e){e.remove();});
  if(!order.length || pos>=order.length){finish();updateHUD();return;}
  const el=document.createElement("div");
  el.className="cw"+(dir==="next"?" in-r":dir==="prev"?" in-l":"");
  el.innerHTML=cardHTML(order[pos]);
  deck.insertBefore(el,endPanel);
  if(dir) requestAnimationFrame(function(){el.classList.remove("in-r","in-l");});
  gestures(el);
  updateHUD();
}

function updateHUD(){
  const n=order.length;
  document.getElementById("posTxt").textContent=Math.min(pos+1,n)+" / "+n;
  document.getElementById("okN").textContent=Object.keys(known).filter(isSnoozed).length;
  document.getElementById("stN").textContent=Object.keys(stars).length;
  document.getElementById("wbCount").textContent=Object.keys(stars).length;
  document.getElementById("fill").style.width=(n?100*Math.min(pos,n)/n:0)+"%";
  document.getElementById("stamp").textContent = "Updated "+BUILT+" · "+ALL.length+" cards · "+
    ({claude:"progress saved in Claude",local:"progress saved on this device",memory:"progress won't be saved"}[backend]);
}

function go(step){
  const next=pos+step;
  if(next<0) return;
  if(next>=order.length){ pos=order.length; render(); return; }
  pos=next; render(step>0?"next":"prev");
}

function grade(kind){
  if(pos>=order.length) return;
  const k=order[pos].key;
  if(kind==="star"){
    delete known[k]; stars[k]=Math.min(5,(stars[k]||0)+1);
    store.set("stars",stars);store.set("known",known);
  }else{
    delete stars[k]; known[k]=Date.now()+SNOOZE_DAYS*DAY;
    store.set("stars",stars);store.set("known",known);
  }
  go(1);
}

function finish(){
  const starred=Object.keys(stars).length;
  const hasCards=order.length>0;
  document.getElementById("endTitle").textContent=hasCards?"Round complete":"No cards here";
  document.getElementById("endTxt").textContent=hasCards
    ? "Your wordbook has "+starred+" starred words, and "+Object.keys(known).filter(isSnoozed).length+" are marked known and hidden for now."
    : "Every word in this section is already known, or you haven't starred any yet.";
  document.getElementById("studyStarBtn").style.display=starred?"block":"none";
  endPanel.classList.add("show");
}
document.getElementById("againBtn").addEventListener("click",function(){starOnly=false;start();});
document.getElementById("studyStarBtn").addEventListener("click",function(){starOnly=true;start();});

/* ---------- gestures ---------- */
function gestures(wrap){
  const card=wrap.querySelector(".card");
  let sx=0,sy=0,dx=0,dy=0,on=false,moved=false;
  wrap.addEventListener("pointerdown",function(e){on=true;moved=false;sx=e.clientX;sy=e.clientY;dx=dy=0;
    wrap.classList.add("drag");wrap.setPointerCapture(e.pointerId);});
  wrap.addEventListener("pointermove",function(e){
    if(!on)return;
    dx=e.clientX-sx;dy=e.clientY-sy;
    if(Math.abs(dx)>6||Math.abs(dy)>6)moved=true;
    wrap.style.transform="translate("+dx+"px,"+(dy*.15)+"px) rotate("+(dx/30)+"deg)";
  });
  wrap.addEventListener("pointerup",function(){
    if(!on)return;on=false;wrap.classList.remove("drag");
    const t=Math.min(90,innerWidth*.22);
    if(dx<-t){ wrap.classList.add("out-l"); setTimeout(function(){go(1);},120); return; }
    if(dx> t){ if(pos===0){wrap.style.transform="";return;}
               wrap.classList.add("out-r"); setTimeout(function(){go(-1);},120); return; }
    wrap.style.transform="";
    if(!moved) card.classList.toggle("flip");
  });
  wrap.addEventListener("pointercancel",function(){on=false;wrap.classList.remove("drag");wrap.style.transform="";});
}

document.getElementById("okBtn").addEventListener("click",function(){grade("known");});
document.getElementById("starBtn").addEventListener("click",function(){grade("star");});
document.getElementById("flipBtn").addEventListener("click",function(){
  const c=deck.querySelector(".cw .card"); if(c)c.classList.toggle("flip");
});
addEventListener("keydown",function(e){
  if(document.getElementById("sheet").classList.contains("show")) return;
  if(document.getElementById("manageSheet").classList.contains("show")) return;
  if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="x"||e.key==="X")grade("star");
  else if(e.key==="Enter")grade("known");
  else if(e.key===" "||e.key==="ArrowUp"){e.preventDefault();document.getElementById("flipBtn").click();}
});

/* ---------- wordbook sheet ---------- */
const sheet=document.getElementById("sheet");
let wbTab="star";
document.querySelectorAll("#wbSeg button").forEach(function(b){b.addEventListener("click",function(){
  document.querySelectorAll("#wbSeg button").forEach(function(x){x.classList.remove("on");});
  b.classList.add("on");wbTab=b.dataset.tab;openWB();
});});
function openWB(){
  const list=document.getElementById("wbList");
  const showStar = wbTab==="star";
  const keys = showStar
    ? Object.keys(stars).sort(function(a,b){return stars[b]-stars[a];})
    : Object.keys(known).filter(isSnoozed).sort(function(a,b){return known[a]-known[b];});
  document.getElementById("sheetTitle").textContent = showStar?"Wordbook":"Known words";
  document.getElementById("wbStudy").style.display = showStar?"block":"none";
  document.getElementById("wbClear").textContent = showStar?"Clear stars":"Restore all";
  document.getElementById("wbSummary").textContent = keys.length
    ? (showStar ? keys.length+" words · more stars = less familiar" : keys.length+" words · returns automatically when the timer ends") : "";
  list.innerHTML = keys.length ? keys.map(function(k){
    const d=cardByKey(k); if(!d) return "";
    const right = showStar ? "★".repeat(stars[k]) : Math.max(1,Math.ceil((known[k]-Date.now())/DAY))+" days";
    return '<div class="wb-item"><div class="wb-text"><div class="e">'+d.en+'</div><div class="z">'+d.zh+'</div></div>'
      +'<span class="wb-stars">'+right+'</span><button class="wb-x" data-x="'+k+'">✕</button></div>';
  }).join("") : '<div class="wb-empty">'+(showStar
      ? "Your wordbook is empty.<br>Tap ✕ while studying to add a star to a word, up to five."
      : "No known words yet.<br>Tap ✓ to mark a word as well known — it will stay hidden for seven days.")+'</div>';
  sheet.classList.add("show");
}
document.getElementById("wbBtn").addEventListener("click",openWB);
document.getElementById("closeSheet").addEventListener("click",function(){sheet.classList.remove("show");updateHUD();});
sheet.addEventListener("click",function(e){if(e.target===sheet){sheet.classList.remove("show");updateHUD();}});
document.getElementById("wbList").addEventListener("click",function(e){
  const x=e.target.closest("[data-x]");if(!x)return;
  const k=x.dataset.x;
  if(wbTab==="star"){delete stars[k];store.set("stars",stars);}
  else{delete known[k];store.set("known",known);}
  openWB();updateHUD();
});
document.getElementById("wbStudy").addEventListener("click",function(){
  if(!Object.keys(stars).length)return;
  sheet.classList.remove("show");starOnly=true;start();
});
document.getElementById("wbClear").addEventListener("click",function(){
  if(wbTab==="star"){stars={};store.set("stars",stars);}else{known={};store.set("known",known);}
  openWB();updateHUD();
});

/* ---------- manage sheet: add / edit / search ---------- */
const manageSheet=document.getElementById("manageSheet");
let editingKey = null; // null = adding a brand new word

function secSubMap(){
  const m={};
  ALL.forEach(function(c){ if(!m[c.sec]) m[c.sec]=new Set(); m[c.sec].add(c.sub); });
  return m;
}
function populateSecSelect(selectedSec){
  const fSec=document.getElementById("fSec");
  const m=secSubMap();
  fSec.innerHTML="";
  Object.keys(m).sort().forEach(function(sec){
    const o=document.createElement("option");o.value=sec;o.textContent=sec;fSec.appendChild(o);
  });
  const optNew=document.createElement("option");optNew.value="__new__";optNew.textContent="+ New section…";fSec.appendChild(optNew);
  fSec.value = selectedSec && m[selectedSec] ? selectedSec : (Object.keys(m).sort()[0]||"__new__");
  populateSubSelect(fSec.value, null);
}
function populateSubSelect(sec, selectedSub){
  const fSub=document.getElementById("fSub");
  fSub.innerHTML="";
  const m=secSubMap();
  const subs = m[sec] ? Array.from(m[sec]).sort() : [];
  subs.forEach(function(sub){
    const o=document.createElement("option");o.value=sub;o.textContent=sub;fSub.appendChild(o);
  });
  const optNew=document.createElement("option");optNew.value="__new__";optNew.textContent="+ New sub-section…";fSub.appendChild(optNew);
  fSub.value = selectedSub && subs.indexOf(selectedSub)>=0 ? selectedSub : (subs[0]||"__new__");
  toggleNewSubField();
}
document.getElementById("fSec").addEventListener("change",function(){
  toggleNewSecField();
  if(this.value!=="__new__") populateSubSelect(this.value,null);
  else document.getElementById("fSub").innerHTML='<option value="__new__">+ New sub-section…</option>';
  toggleNewSubField();
});
document.getElementById("fSub").addEventListener("change",toggleNewSubField);
function toggleNewSecField(){
  const isNew=document.getElementById("fSec").value==="__new__";
  document.getElementById("newSecWrap").style.display = isNew?"block":"none";
}
function toggleNewSubField(){
  const isNew=document.getElementById("fSub").value==="__new__";
  document.getElementById("newSubWrap").style.display = isNew?"block":"none";
}

function resetForm(){
  editingKey=null;
  document.getElementById("fEn").value="";
  document.getElementById("fEn").disabled=false;
  document.getElementById("fZh").value="";
  document.getElementById("fNewSec").value="";
  document.getElementById("fNewSub").value="";
  populateSecSelect(null);
  document.getElementById("hideWordBtn").style.display="none";
  document.getElementById("deleteWordBtn").style.display="none";
  showMsg("","");
}
function showMsg(text,kind){
  const el=document.getElementById("addMsg");
  if(!text){ el.className="msg"; el.textContent=""; return; }
  el.className="msg show "+kind; el.textContent=text;
}
function loadIntoForm(key){
  const d=cardByKey(key);
  if(!d) return;
  editingKey=key;
  document.getElementById("fEn").value=d.en;
  document.getElementById("fEn").disabled = !d.custom; // base-card English stays fixed (it's the lookup key)
  document.getElementById("fZh").value=d.zh;
  populateSecSelect(d.sec);
  populateSubSelect(d.sec, d.sub);
  document.getElementById("hideWordBtn").style.display = d.custom ? "none":"block";
  document.getElementById("deleteWordBtn").style.display = d.custom ? "block":"none";
  showMsg("Editing \""+d.en+"\"","ok");
  switchMTab("add");
}

document.getElementById("saveWordBtn").addEventListener("click",function(){
  const en=document.getElementById("fEn").value.trim();
  const zh=document.getElementById("fZh").value.trim();
  let sec=document.getElementById("fSec").value;
  let sub=document.getElementById("fSub").value;
  if(sec==="__new__"){ sec=document.getElementById("fNewSec").value.trim(); }
  if(sub==="__new__"){ sub=document.getElementById("fNewSub").value.trim()||"General"; }
  if(!en||!zh||!sec){ showMsg("Please fill in the English, Chinese, and section","warn"); return; }
  const key = en.toLowerCase().trim();

  if(editingKey && BASE_KEYS[editingKey]){
    // editing a base card: store as an override (zh/sec/sub), English stays as-is
    overrides[editingKey] = { zh:zh, sec:sec, sub:sub };
    store.set("overrides", overrides);
    showMsg("Updated the translation and category for \""+en+"\"","ok");
  } else {
    // brand new card OR editing an existing custom card
    if(editingKey && editingKey!==key && customCards[editingKey]){
      delete customCards[editingKey]; // english text changed, move to new key
    }
    if(BASE_KEYS[key] && !editingKey){
      // typed an EN that matches a base card exactly -> treat as edit of that base card
      overrides[key] = { zh:zh, sec:sec, sub:sub };
      store.set("overrides", overrides);
      showMsg("That word is already in the deck — updated its translation and category","ok");
    } else {
      customCards[key] = { en:en, zh:zh, sec:sec, sub:sub };
      store.set("customCards", customCards);
      showMsg("Saved \""+en+"\"","ok");
    }
  }
  rebuildAll();
  buildCatMenu();
  resetForm();
  start();
});

document.getElementById("hideWordBtn").addEventListener("click",function(){
  if(!editingKey) return;
  overrides[editingKey] = Object.assign({}, overrides[editingKey]||{}, {hidden:true});
  store.set("overrides", overrides);
  rebuildAll(); buildCatMenu(); resetForm(); start();
  showMsg("Hidden from the deck","ok");
});
document.getElementById("deleteWordBtn").addEventListener("click",function(){
  if(!editingKey) return;
  delete customCards[editingKey];
  store.set("customCards", customCards);
  delete stars[editingKey]; delete known[editingKey];
  store.set("stars",stars); store.set("known",known);
  rebuildAll(); buildCatMenu(); resetForm(); start();
  showMsg("Deleted","ok");
});
document.getElementById("clearFormBtn").addEventListener("click",resetForm);

function switchMTab(tab){
  document.querySelectorAll("#mtabs button").forEach(function(b){b.classList.toggle("on", b.dataset.tab===tab);});
  document.getElementById("paneAdd").style.display = tab==="add"?"block":"none";
  document.getElementById("paneSearch").style.display = tab==="search"?"block":"none";
}
document.querySelectorAll("#mtabs button").forEach(function(b){
  b.addEventListener("click",function(){ switchMTab(b.dataset.tab); });
});

document.getElementById("manageBtn").addEventListener("click",function(){
  manageSheet.classList.add("show");
  resetForm();
  switchMTab("add");
});
document.getElementById("closeManage").addEventListener("click",function(){manageSheet.classList.remove("show");});
manageSheet.addEventListener("click",function(e){if(e.target===manageSheet)manageSheet.classList.remove("show");});

document.getElementById("searchBox").addEventListener("input",function(){
  const q=this.value.trim().toLowerCase();
  const res=document.getElementById("searchResults");
  if(!q){ res.innerHTML='<div class="wb-empty">Type an English or Chinese keyword to find existing words.</div>'; return; }
  const hits = ALL.filter(function(c){
    return c.en.toLowerCase().indexOf(q)>=0 || c.zh.indexOf(q)>=0;
  }).slice(0,60);
  res.innerHTML = hits.length ? hits.map(function(c){
    return '<div class="search-hit" data-key="'+c.key+'"><div class="e">'+c.en+(c.custom?' <span style="color:var(--blue);font-size:.65rem">custom</span>':'')+'</div>'
      +'<div class="z">'+c.zh+'</div><div class="c">'+c.sec+' · '+c.sub+'</div>'
      +'<span class="edit-link">Edit →</span></div>';
  }).join("") : '<div class="wb-empty">No matching words found.</div>';
});
document.getElementById("searchResults").addEventListener("click",function(e){
  const hit=e.target.closest("[data-key]"); if(!hit) return;
  loadIntoForm(hit.dataset.key);
});

/* ---------- boot ---------- */
(async function(){
  stars=(await store.get("stars"))||{};
  known=(await store.get("known"))||{};
  customCards=(await store.get("customCards"))||{};
  overrides=(await store.get("overrides"))||{};
  Object.keys(known).forEach(function(k){ if(!isSnoozed(k)) delete known[k]; });
  rebuildAll();
  buildCatMenu();
  start();
})();
</script>
</body>
</html>
