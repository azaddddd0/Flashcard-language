<style>
:root{
  --paper:#F5F2EA; --ink:#1C1D1F; --ink-soft:#6D6B65;
  --seal:#C03A22; --jade:#2C7A57; --card:#FFFFFF; --line:#E2DCCF; --gold:#C9A227; --r:22px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans SC',-apple-system,sans-serif;
  display:flex;flex-direction:column;max-width:540px;margin:0 auto;height:100vh;height:100dvh;
  padding:12px 16px calc(10px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:8px}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:1.05rem;flex:1;line-height:1.15}
h1 em{font-style:normal;color:var(--seal)}
h1 small{display:block;font-family:'Noto Sans SC',sans-serif;font-weight:400;font-size:.6rem;color:var(--ink-soft);letter-spacing:.02em}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:.75rem;color:var(--ink)}
.icon-btn b{color:var(--gold)}
select{font-family:inherit;font-size:.72rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;max-width:46%}
.row{display:flex;gap:7px;margin-top:9px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;font-size:.72rem;padding:5px 11px;color:var(--ink-soft)}
.seg button.on{background:var(--ink);color:var(--paper)}
.bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--jade);transition:width .2s}
.stats{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-soft);margin-top:5px}
.stats b.ok{color:var(--jade)}.stats b.st{color:var(--gold)}
.deck{position:relative;flex:1;min-height:0;margin:12px 0}
.cw{position:absolute;inset:0;touch-action:none;transition:transform .28s cubic-bezier(.2,.8,.3,1),opacity .28s}
.cw.drag{transition:none}
.cw.out-l{transform:translateX(-120%) rotate(-8deg);opacity:0}
.cw.out-r{transform:translateX(120%) rotate(8deg);opacity:0}
.cw.in-l{transform:translateX(-120%) rotate(-8deg);opacity:0}
.cw.in-r{transform:translateX(120%) rotate(8deg);opacity:0}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.9,.3,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);box-shadow:0 10px 26px rgba(28,29,31,.09);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:58px 26px;text-align:center}
.face.back{transform:rotateY(180deg)}
.chip{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:center;font-size:.62rem}
.chip .sub{color:var(--seal);border:1.4px solid var(--seal);border-radius:6px;padding:3px 7px;transform:rotate(-2deg);max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .side{color:var(--ink-soft);letter-spacing:.12em}
.en{font-family:'Fraunces',serif;font-weight:600;font-size:1.5rem;line-height:1.32}
.zh{font-weight:500;font-size:1.42rem;line-height:1.5}
.mark{position:absolute;bottom:36px;font-size:.8rem;letter-spacing:2px;color:var(--gold)}
.mark.known{color:var(--jade);letter-spacing:0;font-size:.72rem;border:1.4px solid var(--jade);border-radius:6px;padding:2px 8px}
.hint{position:absolute;bottom:14px;left:0;right:0;font-size:.65rem;color:var(--ink-soft)}
.nav{position:absolute;top:50%;transform:translateY(-50%);font-size:1.4rem;color:var(--ink-soft);opacity:0;transition:opacity .12s;pointer-events:none}
.nav.l{left:16px}.nav.r{right:16px}
.ctrls{display:flex;justify-content:center;align-items:center;gap:22px}
.ctrl{width:60px;height:60px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);
  font-size:1.4rem;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(28,29,31,.07);transition:transform .1s}
.ctrl:active{transform:scale(.9)}
.ctrl.small{width:46px;height:46px;font-size:1rem;color:var(--ink-soft)}
.ctrl.st{color:var(--gold)}.ctrl.ok{color:var(--jade)}
.end{position:absolute;inset:0;border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}
.end.show{display:flex}
.end .seal{font-family:'Fraunces',serif;font-size:1.9rem;color:var(--jade);border:3px solid var(--jade);border-radius:10px;padding:6px 15px;transform:rotate(-5deg)}
.end h2{font-family:'Fraunces',serif;font-size:1.35rem}
.end p{font-size:.83rem;color:var(--ink-soft);line-height:1.6}
.pill{border:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 20px;font-size:.82rem}
.pill.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.sheet{position:fixed;inset:0;background:rgba(28,29,31,.35);display:none;z-index:20}
.sheet.show{display:block}
.sheet-inner{position:absolute;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;height:88%;
  background:var(--paper);border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head h2{font-family:'Fraunces',serif;font-size:1.1rem;flex:1}
.wb-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:10px}
.wb-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.wb-text{flex:1;min-width:0}
.wb-text .e{font-family:'Fraunces',serif;font-weight:600;font-size:.92rem}
.wb-text .z{font-size:.82rem;color:var(--ink-soft);margin-top:2px}
.wb-stars{color:var(--gold);font-size:.78rem;letter-spacing:1px;white-space:nowrap}
.wb-x{border:none;background:none;color:var(--ink-soft);font-size:1rem;padding:4px 2px}
.wb-empty{text-align:center;color:var(--ink-soft);font-size:.85rem;padding:40px 20px;line-height:1.8}
.sheet-foot{display:flex;gap:8px;padding-top:10px}
.sheet-foot .pill{flex:1;text-align:center}
@media (prefers-reduced-motion:reduce){.card,.cw,.bar i{transition:none}}
</style>
</head>
<body>

<header>
  <h1>Casual oral <em>0711</em><small id="stamp"></small></h1>
  <button class="icon-btn" id="wbBtn">★ <b id="wbCount">0</b></button>
</header>

<div class="row">
  <div class="seg" id="modeSeg">
    <button data-mode="mix" class="on">随机</button>
    <button data-mode="en">EN→中</button>
    <button data-mode="zh">中→EN</button>
  </div>
  <select id="catSel"></select>
</div>

<div class="bar"><i id="fill"></i></div>
<div class="stats">
  <span id="posTxt">0 / 0</span>
  <span><b class="ok" id="okN">0</b> 熟 · <b class="st" id="stN">0</b> 星</span>
</div>

<div class="deck" id="deck">
  <div class="end" id="end">
    <div class="seal">完</div>
    <h2 id="endTitle">这一轮结束</h2>
    <p id="endTxt"></p>
    <button class="pill" id="againBtn">重新洗牌</button>
    <button class="pill alt" id="studyStarBtn">只练星标词</button>
  </div>
</div>

<div class="ctrls">
  <button class="ctrl st" id="starBtn" title="不熟，加一颗星">✕</button>
  <button class="ctrl small" id="flipBtn" title="翻面">⇄</button>
  <button class="ctrl ok" id="okBtn" title="很熟，暂时不再出现">✓</button>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <div class="sheet-head">
      <h2 id="sheetTitle">生词本</h2>
      <div class="seg" id="wbSeg">
        <button data-tab="star" class="on">生词</button>
        <button data-tab="known">熟词</button>
      </div>
      <button class="icon-btn" id="closeSheet">关闭</button>
    </div>
    <div class="stats"><span id="wbSummary"></span></div>
    <div class="wb-list" id="wbList"></div>
    <div class="sheet-foot">
      <button class="pill" id="wbStudy">练这些词</button>
      <button class="pill alt" id="wbClear">清空</button>
    </div>
  </div>
</div>

<script>
addEventListener("error",function(ev){
  const d=document.getElementById("deck");
  if(d) d.innerHTML='<div class="end show" style="display:flex"><h2>出错了</h2><p style="word-break:break-word">'
    +(ev.message||ev.error||"unknown")+'</p><p>把这段话发给 Claude 就能定位问题。</p></div>';
});

ood & drink", "sub": "Eating & drinking"}, {"en": "Booze", "zh": "酒", "sec": "Food & drink", "sub": "Eating & drinking"}, {"en": "Bartending", "zh": "调酒", "sec": "Food & drink", "sub": "Eating & drinking"}, {"en": "Shaker / jigger / strainer", "zh": "调酒器 / 量酒器 / 滤冰器", "sec": "Food & drink", "sub": "Eating & drinking"}, {"en": "On the rocks", "zh": "加冰", "sec": "Food & drink", "sub": "Eating & drinking"}, {"en": "Drink like a fish", "zh": "酒量好", "sec": "Food & drink", "sub": "Eating & drinking"}, {"en": "Wasted / hammered", "zh": "烂醉", "sec": "Food & drink", "sub": "Eating & drinking"}, {"en": "I'm on the wagon", "zh": "戒酒", "sec": "Food & drink", "sub": "Eating & drinking"}, {"en": "Chug a bottle / a chugging contest", "zh": "吨吨吨 / 一口闷比赛", "sec": "Food & drink", "sub": "Eating & drinking"}, {"en": "Bottoms up!", "zh": "干杯", "sec": "Food & drink", "sub": "Eating & drinking"}, {"en": "Hold my beer!", "zh": "看我的！（好胜）", "sec": "Food & drink", "sub": "Eating & drinking"}, {"en": "Drunk-dialed", "zh": "醉酒后打电话", "sec": "Food & drink", "sub": "Eating & drinking"}, {"en": "To be intoxicated", "zh": "喝得烂醉", "sec": "Food & drink", "sub": "Eating & drinking"}, {"en": "Top shelf", "zh": "高档的酒", "sec": "Food & drink", "sub": "Eating & drinking"}];
DATA.forEach(c=>c.key=c.en.toLowerCase());
document.getElementById("stamp").textContent = "从 Notion 生成 · "+BUILT+" · "+DATA.length+" 张";

const SNOOZE_DAYS = 7;
const DAY = 86400000;

/* ---------- storage: keyed by the English text, so it survives deck updates ---------- */
var mem={}, backend="memory";
try{ if(window.localStorage){ localStorage.setItem("co-probe","1"); localStorage.removeItem("co-probe"); backend="local"; } }catch(e){}
try{ if(window.storage && typeof window.storage.get==="function"){ backend="claude"; } }catch(e){}

const store={
  async get(k){
    if(backend==="claude"){
      try{ const r=await window.storage.get(k); return r?JSON.parse(r.value):null; }catch(e){}
    }
    if(backend==="local"){
      try{ const v=localStorage.getItem("co0711:"+k); return v?JSON.parse(v):null; }catch(e){}
    }
    return mem[k]||null;
  },
  async set(k,v){
    mem[k]=v;
    if(backend==="claude"){
      try{ await window.storage.set(k,JSON.stringify(v)); return; }catch(e){}
    }
    if(backend==="local"){
      try{ localStorage.setItem("co0711:"+k,JSON.stringify(v)); }catch(e){}
    }
  }
};
let stars={};   // key -> 1..5
let known={};   // key -> timestamp (hidden until)

/* ---------- state ---------- */
let mode="mix", cat="all", starOnly=false;
let order=[], pos=0;
const deck=document.getElementById("deck"), endPanel=document.getElementById("end");
const isSnoozed=k=>(known[k]||0)>Date.now();

(function buildCatMenu(){
  const sel=document.getElementById("catSel");
  sel.innerHTML='<option value="all">全部 All sections</option>';
  const bySec={};
  DATA.forEach(function(c){ if(!bySec[c.sec]) bySec[c.sec]=new Set(); bySec[c.sec].add(c.sub); });
  Object.keys(bySec).forEach(sec=>{
    const g=document.createElement("optgroup");g.label=sec;
    const a=document.createElement("option");a.value="sec:"+sec;a.textContent="— 整章 "+sec;g.appendChild(a);
    [...bySec[sec]].forEach(sub=>{const o=document.createElement("option");o.value="sub:"+sub;o.textContent=sub;g.appendChild(o);});
    sel.appendChild(g);
  });
  sel.addEventListener("change",()=>{cat=sel.value;starOnly=false;start();});
})();

document.querySelectorAll("#modeSeg button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#modeSeg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");mode=b.dataset.mode;start();
}));

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

function pool(){
  let p = starOnly ? DATA.filter(c=>stars[c.key])
    : cat==="all" ? DATA.slice()
    : (()=>{const [k,v]=cat.split(/:(.+)/);return DATA.filter(c=>k==="sec"?c.sec===v:c.sub===v);})();
  if(!starOnly) p=p.filter(c=>!isSnoozed(c.key));
  return p;
}

function start(){
  order=shuffle(pool().map(c=>({key:c.key,i:DATA.indexOf(c),side:mode==="mix"?(Math.random()<.5?"en":"zh"):mode})));
  pos=0;endPanel.classList.remove("show");render();
}

/* ---------- render ---------- */
function cardHTML(item){
  const d=DATA[item.i], frontEn=item.side==="en";
  const s=stars[d.key]||0;
  const mark = isSnoozed(d.key) ? `<div class="mark known">熟词 · ${SNOOZE_DAYS} 天内不再出现</div>`
             : s ? `<div class="mark">${"★".repeat(s)}${"☆".repeat(5-s)}</div>` : "";
  const face=(isEn,txt,tag,isFront)=>`
    <div class="face ${isFront?"front":"back"}">
      <div class="chip"><span class="sub">${d.sub}</span><span class="side">${tag}</span></div>
      <div class="${isEn?"en":"zh"}">${txt}</div>
      ${mark}
      <div class="hint">点一下翻面 · 左右滑动翻页 · ✕ 加星 · ✓ 我很熟</div>
      <span class="nav l">‹</span><span class="nav r">›</span>
    </div>`;
  return `<div class="card">
    ${face(frontEn, frontEn?d.en:d.zh, frontEn?"EN":"中", true)}
    ${face(!frontEn, frontEn?d.zh:d.en, frontEn?"中":"EN", false)}
  </div>`;
}

function render(dir){
  deck.querySelectorAll(".cw").forEach(e=>e.remove());
  if(!order.length || pos>=order.length){finish();updateHUD();return;}
  const el=document.createElement("div");
  el.className="cw"+(dir==="next"?" in-r":dir==="prev"?" in-l":"");
  el.innerHTML=cardHTML(order[pos]);
  deck.insertBefore(el,endPanel);
  if(dir) requestAnimationFrame(()=>el.classList.remove("in-r","in-l"));
  gestures(el);
  updateHUD();
}

function updateHUD(){
  const n=order.length;
  document.getElementById("posTxt").textContent=`${Math.min(pos+1,n)} / ${n}`;
  document.getElementById("okN").textContent=Object.keys(known).filter(k=>isSnoozed(k)).length;
  document.getElementById("stN").textContent=Object.keys(stars).length;
  document.getElementById("wbCount").textContent=Object.keys(stars).length;
  document.getElementById("fill").style.width=(n?100*Math.min(pos,n)/n:0)+"%";
}

/* ---------- navigation (swipe) ---------- */
function go(step){
  const next=pos+step;
  if(next<0) return;
  if(next>=order.length){ pos=order.length; render(); return; }
  pos=next; render(step>0?"next":"prev");
}

/* ---------- grading (buttons) ---------- */
function grade(kind){
  if(pos>=order.length) return;
  const k=order[pos].key;
  if(kind==="star"){
    delete known[k];
    stars[k]=Math.min(5,(stars[k]||0)+1);
    store.set("stars",stars);store.set("known",known);
  }else{
    delete stars[k];
    known[k]=Date.now()+SNOOZE_DAYS*DAY;
    store.set("stars",stars);store.set("known",known);
  }
  go(1);
}

function finish(){
  const starred=Object.keys(stars).length;
  const hasCards=order.length>0;
  document.getElementById("endTitle").textContent=hasCards?"这一轮结束":"这里没有卡片";
  document.getElementById("endTxt").textContent=hasCards
    ? `生词本里有 ${starred} 个词，${Object.keys(known).filter(isSnoozed).length} 个词标成了熟词，暂时不出现。`
    : "这个章节的词都标成熟词了，或者还没加过星。";
  document.getElementById("studyStarBtn").style.display=starred?"block":"none";
  endPanel.classList.add("show");
}
document.getElementById("againBtn").addEventListener("click",()=>{starOnly=false;start();});
document.getElementById("studyStarBtn").addEventListener("click",()=>{starOnly=true;start();});

/* ---------- gestures ---------- */
function gestures(wrap){
  const card=wrap.querySelector(".card");
  let sx=0,sy=0,dx=0,dy=0,on=false,moved=false;
  const navs=()=>({l:card.querySelectorAll(".nav.l"),r:card.querySelectorAll(".nav.r")});
  const clear=()=>{const n=navs();n.l.forEach(x=>x.style.opacity=0);n.r.forEach(x=>x.style.opacity=0);};
  wrap.addEventListener("pointerdown",e=>{on=true;moved=false;sx=e.clientX;sy=e.clientY;dx=dy=0;
    wrap.classList.add("drag");wrap.setPointerCapture(e.pointerId);});
  wrap.addEventListener("pointermove",e=>{
    if(!on)return;
    dx=e.clientX-sx;dy=e.clientY-sy;
    if(Math.abs(dx)>6||Math.abs(dy)>6)moved=true;
    wrap.style.transform=`translate(${dx}px,${dy*.15}px) rotate(${dx/30}deg)`;
    const n=navs(),p=Math.min(Math.abs(dx)/80,1);
    if(dx>0){n.l.forEach(x=>x.style.opacity=p);n.r.forEach(x=>x.style.opacity=0);}
    else{n.r.forEach(x=>x.style.opacity=p);n.l.forEach(x=>x.style.opacity=0);}
  });
  wrap.addEventListener("pointerup",()=>{
    if(!on)return;on=false;wrap.classList.remove("drag");
    const t=Math.min(90,innerWidth*.22);
    if(dx<-t){ wrap.classList.add("out-l"); setTimeout(()=>go(1),120); return; }   /* 左滑 → 下一张 */
    if(dx> t){ if(pos===0){wrap.style.transform="";clear();return;}
               wrap.classList.add("out-r"); setTimeout(()=>go(-1),120); return; }  /* 右滑 → 上一张 */
    wrap.style.transform="";clear();
    if(!moved) card.classList.toggle("flip");
  });
  wrap.addEventListener("pointercancel",()=>{on=false;wrap.classList.remove("drag");wrap.style.transform="";clear();});
}

document.getElementById("okBtn").addEventListener("click",()=>grade("known"));
document.getElementById("starBtn").addEventListener("click",()=>grade("star"));
document.getElementById("flipBtn").addEventListener("click",()=>{
  const c=deck.querySelector(".cw .card"); if(c)c.classList.toggle("flip");
});
addEventListener("keydown",e=>{
  if(document.getElementById("sheet").classList.contains("show"))return;
  if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="x"||e.key==="X")grade("star");
  else if(e.key==="Enter")grade("known");
  else if(e.key===" "||e.key==="ArrowUp"){e.preventDefault();document.getElementById("flipBtn").click();}
});

/* ---------- wordbook ---------- */
const sheet=document.getElementById("sheet");
let tab="star";
document.querySelectorAll("#wbSeg button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#wbSeg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");tab=b.dataset.tab;openWB();
}));
function openWB(){
  const list=document.getElementById("wbList");
  const showStar = tab==="star";
  const keys = showStar
    ? Object.keys(stars).sort((a,b)=>stars[b]-stars[a])
    : Object.keys(known).filter(isSnoozed).sort((a,b)=>known[a]-known[b]);
  document.getElementById("sheetTitle").textContent = showStar?"生词本":"熟词";
  document.getElementById("wbStudy").style.display = showStar?"block":"none";
  document.getElementById("wbClear").textContent = showStar?"清空星标":"全部恢复";
  document.getElementById("wbSummary").textContent = keys.length
    ? (showStar ? `${keys.length} 个词 · 星越多越不熟` : `${keys.length} 个词 · 到期后自动回到牌堆`) : "";
  list.innerHTML = keys.length ? keys.map(k=>{
    const d=DATA.find(c=>c.key===k); if(!d) return "";
    const right = showStar ? "★".repeat(stars[k])
      : Math.max(1,Math.ceil((known[k]-Date.now())/DAY))+" 天";
    return `<div class="wb-item">
      <div class="wb-text"><div class="e">${d.en}</div><div class="z">${d.zh}</div></div>
      <span class="wb-stars">${right}</span>
      <button class="wb-x" data-x="${k}">✕</button></div>`;
  }).join("") : `<div class="wb-empty">${showStar
      ? "生词本还是空的。<br>练习时点 ✕ 就会给这个词加一颗星，最多五颗。"
      : "还没有熟词。<br>点 ✓ 表示这个词很熟，它会有七天不再出现。"}</div>`;
  sheet.classList.add("show");
}
document.getElementById("wbBtn").addEventListener("click",openWB);
document.getElementById("closeSheet").addEventListener("click",()=>{sheet.classList.remove("show");updateHUD();});
sheet.addEventListener("click",e=>{if(e.target===sheet){sheet.classList.remove("show");updateHUD();}});
document.getElementById("wbList").addEventListener("click",e=>{
  const x=e.target.closest("[data-x]");if(!x)return;
  const k=x.dataset.x;
  if(tab==="star"){delete stars[k];store.set("stars",stars);}
  else{delete known[k];store.set("known",known);}
  openWB();updateHUD();
});
document.getElementById("wbStudy").addEventListener("click",()=>{
  if(!Object.keys(stars).length)return;
  sheet.classList.remove("show");starOnly=true;start();
});
document.getElementById("wbClear").addEventListener("click",()=>{
  if(tab==="star"){stars={};store.set("stars",stars);}else{known={};store.set("known",known);}
  openWB();updateHUD();
});

/* ---------- boot ---------- */
(async()=>{
  const where={claude:"进度存在 Claude",local:"进度存在这台设备",memory:"进度不会保存"}[backend];
  document.getElementById("stamp").textContent="从 Notion 生成 · "+BUILT+" · "+DATA.length+" 张 · "+where;
  stars=(await store.get("stars"))||{};
  known=(await store.get("known"))||{};
  Object.keys(known).forEach(k=>{if(!isSnoozed(k))delete known[k];});
  start();
})();
</script>
